        so we can put things right:\",\"metadata\":{\"coordinates\":{\"points\":[[185.2508544921875,934.9784545898438],[185.2508544921875,1022.0018506250001],[720.3519343027779,1022.0018506250001],[720.3519343027779,934.9784545898438]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"0996b535cedacddae110fab31876433a\",\"filename\":\"I-575655elec_flat.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"5afd8aa77da703d9e1bac2c91b8e509d\",\"text\":\"First:
        Contact our team.\",\"metadata\":{\"coordinates\":{\"points\":[[184.0150909423828,1034.671142578125],[184.0150909423828,1062.123239513889],[461.29632568359375,1062.123239513889],[461.29632568359375,1034.671142578125]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"0996b535cedacddae110fab31876433a\",\"filename\":\"I-575655elec_flat.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"00cbbd0c275eb25ed3cc7b8d6ebad649\",\"text\":\"Then:
        If an advisor is not able to resolve your query, you can ask for it to be
        escalated to a specialist or team leader as appropriate.\",\"metadata\":{\"coordinates\":{\"points\":[[181.58787536621094,1075.8505859375],[181.58787536621094,1163.1728515625],[778.4576416015625,1163.1728515625],[778.4576416015625,1075.8505859375]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"0996b535cedacddae110fab31876433a\",\"filename\":\"I-575655elec_flat.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"f9b1b7836292eb2b3cd693a0da19806a\",\"text\":\"Finally:
        If you're still not happy with our decision, you can contact our Operations
        Manager for an independent review, and you will receive a reply within 5 working
        days.\",\"metadata\":{\"coordinates\":{\"points\":[[179.371337890625,1175.337646484375],[179.371337890625,1293.20068359375],[789.7719482027777,1293.20068359375],[789.7719482027777,1175.337646484375]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"0996b535cedacddae110fab31876433a\",\"filename\":\"I-575655elec_flat.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"07f62d8108f31f157f3b73db64075e12\",\"text\":\"If
        you have followed the above steps, but your complaint remains unresolved after
        8 weeks you can contact the Energy Ombudsman on 0330 440 1624 or at www.energyombudsman.org.
        This is a free and independent service whose decisions we must abide by.\",\"metadata\":{\"coordinates\":{\"points\":[[183.5640411376953,1304.829345703125],[183.5640411376953,1483.3976839583336],[797.8282470703125,1483.3976839583336],[797.8282470703125,1304.829345703125]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"0996b535cedacddae110fab31876433a\",\"filename\":\"I-575655elec_flat.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"597a07730b9418f2006828ec7c19401c\",\"text\":\"You
        can read our complaints policy on our website.\",\"metadata\":{\"coordinates\":{\"points\":[[187.0410277777778,1496.0269775390625],[187.0410277777778,1525.5191650390625],[766.8867797851562,1525.5191650390625],[766.8867797851562,1496.0269775390625]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"0996b535cedacddae110fab31876433a\",\"filename\":\"I-575655elec_flat.pdf\"}},{\"type\":\"Title\",\"element_id\":\"1032ab73a34de70f2bfc85ff54c5c64a\",\"text\":\"Ending
        your contract with us\",\"metadata\":{\"coordinates\":{\"points\":[[897.8530555555556,529.5321044921875],[897.8530555555556,564.818359375],[1358.1463623046875,564.818359375],[1358.1463623046875,529.5321044921875]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"filename\":\"I-575655elec_flat.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"1bdbe99d2106b7db5b06659889653ffe\",\"text\":\"You
        can end your contract at any time by giving us 30 days' notice. However, the
