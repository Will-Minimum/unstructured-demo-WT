        Contact our team.\",\"metadata\":{\"coordinates\":{\"points\":[[184.0150909423828,1034.671142578125],[184.0150909423828,1062.123239513889],[461.29632568359375,1062.123239513889],[461.29632568359375,1034.671142578125]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"a8ec9058c3c82e9d8d0708a31a548e3a\",\"filename\":\"I-575655elec_flat_f2f431aa-64e7-4a42-ac50-17fc75a3cfe9.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"510fc6b96f92efc1862439b4abcc869f\",\"text\":\"Then:
        If an advisor is not able to resolve your query, you can ask for it to be
        escalated to a specialist or team leader as appropriate.\",\"metadata\":{\"coordinates\":{\"points\":[[181.58787536621094,1075.8505859375],[181.58787536621094,1163.1728515625],[778.4576416015625,1163.1728515625],[778.4576416015625,1075.8505859375]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"a8ec9058c3c82e9d8d0708a31a548e3a\",\"filename\":\"I-575655elec_flat_f2f431aa-64e7-4a42-ac50-17fc75a3cfe9.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"94371aff33ea0eac59cca0a71ba2023a\",\"text\":\"Finally:
        If you're still not happy with our decision, you can contact our Operations
        Manager for an independent review, and you will receive a reply within 5 working
        days.\",\"metadata\":{\"coordinates\":{\"points\":[[179.371337890625,1175.337646484375],[179.371337890625,1293.20068359375],[789.7719482027777,1293.20068359375],[789.7719482027777,1175.337646484375]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"a8ec9058c3c82e9d8d0708a31a548e3a\",\"filename\":\"I-575655elec_flat_f2f431aa-64e7-4a42-ac50-17fc75a3cfe9.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"c9978a7e1a6178ba700ee29c6d75b1e8\",\"text\":\"If
        you have followed the above steps, but your complaint remains unresolved after
        8 weeks you can contact the Energy Ombudsman on 0330 440 1624 or at www.energyombudsman.org.
        This is a free and independent service whose decisions we must abide by.\",\"metadata\":{\"coordinates\":{\"points\":[[183.5640411376953,1304.829345703125],[183.5640411376953,1483.3976839583336],[797.8282470703125,1483.3976839583336],[797.8282470703125,1304.829345703125]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"a8ec9058c3c82e9d8d0708a31a548e3a\",\"filename\":\"I-575655elec_flat_f2f431aa-64e7-4a42-ac50-17fc75a3cfe9.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"0b42216a00d5f4da387c0a0608c63f64\",\"text\":\"You
        can read our complaints policy on our website.\",\"metadata\":{\"coordinates\":{\"points\":[[187.0410277777778,1496.0269775390625],[187.0410277777778,1525.5191650390625],[766.8867797851562,1525.5191650390625],[766.8867797851562,1496.0269775390625]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"a8ec9058c3c82e9d8d0708a31a548e3a\",\"filename\":\"I-575655elec_flat_f2f431aa-64e7-4a42-ac50-17fc75a3cfe9.pdf\"}},{\"type\":\"Title\",\"element_id\":\"664df84ebfb9a87c0195702ac0495b38\",\"text\":\"Ending
        your contract with us\",\"metadata\":{\"coordinates\":{\"points\":[[897.8530555555556,529.5321044921875],[897.8530555555556,564.818359375],[1358.1463623046875,564.818359375],[1358.1463623046875,529.5321044921875]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"filename\":\"I-575655elec_flat_f2f431aa-64e7-4a42-ac50-17fc75a3cfe9.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"0cfe06d5e14e91cbd1e261808d17380e\",\"text\":\"You
        can end your contract at any time by giving us 30 days' notice. However, the
        effects of ending your contract differ depending on where you are within your
        contract period:\",\"metadata\":{\"coordinates\":{\"points\":[[895.4970092773438,595.8157348632812],[895.4970092773438,712.7593506249998],[1512.4208984375,712.7593506249998],[1512.4208984375,595.8157348632812]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"664df84ebfb9a87c0195702ac0495b38\",\"filename\":\"I-575655elec_flat_f2f431aa-64e7-4a42-ac50-17fc75a3cfe9.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"74a03974e259eb31896a47d862ee68a4\",\"text\":\"In
        contract, not within the final 30 days: we reserve the right to charge exit
        fees. Please see section 12 of our Terms and Conditions for more details.\",\"metadata\":{\"coordinates\":{\"points\":[[894.3509521484375,724.7777099609375],[894.3509521484375,843.1537950694443],[1446.152099609375,843.1537950694443],[1446.152099609375,724.7777099609375]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"664df84ebfb9a87c0195702ac0495b38\",\"filename\":\"I-575655elec_flat_f2f431aa-64e7-4a42-ac50-17fc75a3cfe9.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"11491df1ccddd2b96a0d0777e32897e1\",\"text\":\"In
        contract, within the final 30 days: you can leave at any time after the last
        day of your contract (even if you give notice less than 30 days before the
        contract end date)\",\"metadata\":{\"coordinates\":{\"points\":[[894.7727661132812,856.2621459960938],[894.7727661132812,973.548239513889],[1503.4169921875,973.548239513889],[1503.4169921875,856.2621459960938]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"664df84ebfb9a87c0195702ac0495b38\",\"filename\":\"I-575655elec_flat_f2f431aa-64e7-4a42-ac50-17fc75a3cfe9.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"672b7bcebf638930a6e872cbcc1215cc\",\"text\":\"Out
        of contract: If you are out of contract with us, you'll simply be moved onto
        to our fairly-priced Variable tariff (we don't believe in expensive out of
        contract rates). On this tariff you're free to leave at any time \u2013 though
        of course we'd love you to get in touch to see if you could save money by
        re-fixing.\",\"metadata\":{\"coordinates\":{\"points\":[[893.1102294921875,986.7069702148438],[893.1102294921875,1165.6534423828125],[1484.20556640625,1165.6534423828125],[1484.20556640625,986.7069702148438]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"664df84ebfb9a87c0195702ac0495b38\",\"filename\":\"I-575655elec_flat_f2f431aa-64e7-4a42-ac50-17fc75a3cfe9.pdf\"}},{\"type\":\"Title\",\"element_id\":\"f2a9552c5e13e46da63a4d252641659f\",\"text\":\"Paying
        by bank transfer\",\"metadata\":{\"coordinates\":{\"points\":[[897.8530555555556,1188.553466796875],[897.8530555555556,1225.2960205078125],[1280.7720947265625,1225.2960205078125],[1280.7720947265625,1188.553466796875]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"filename\":\"I-575655elec_flat_f2f431aa-64e7-4a42-ac50-17fc75a3cfe9.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"eda33f4b2780137248da8143353493da\",\"text\":\"We
        are also able to accept one-off payments by bank transfer. However, please
        do not use this method if you already have an active direct debit with us
        as you may end up paying twice.\",\"metadata\":{\"coordinates\":{\"points\":[[892.6459350585938,1267.624755859375],[892.6459350585938,1384.8453369140625],[1507.115234375,1384.8453369140625],[1507.115234375,1267.624755859375]],\"system\":\"PixelSpace\",\"layout_width\":1654,\"layout_height\":2339},\"filetype\":\"application/pdf\",\"languages\":[\"eng\"],\"page_number\":4,\"parent_id\":\"f2a9552c5e13e46da63a4d252641659f\",\"filename\":\"I-575655elec_flat_f2f431aa-64e7-4a42-ac50-17fc75a3cfe9.pdf\"}},{\"type\":\"NarrativeText\",\"element_id\":\"2784cf88c970397b45fd798661bbcfe0\",\"text\":\"It's
        important that you enter your account reference as the payment reference,
